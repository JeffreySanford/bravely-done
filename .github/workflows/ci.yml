name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bravely:bravely_dev_only@localhost:5432/bravely_done?schema=public
      # CI-only secret, unrelated to any real environment's signing key.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      FRONTEND_ORIGIN: http://localhost:4200
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bravely
          POSTGRES_PASSWORD: bravely_dev_only
          POSTGRES_DB: bravely_done
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bravely -d bravely_done"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @org/backend exec prisma generate --config prisma.config.ts

      - name: Apply database migrations
        run: pnpm --filter @org/backend exec prisma migrate deploy --config prisma.config.ts

      - name: Generate OpenAPI contract and typed Angular client
        run: pnpm exec nx run frontend:generate-api

      - name: Check formatting
        run: pnpm exec nx format:check --base=origin/master

      - name: Build, lint, and unit test
        run: pnpm exec nx run-many -t build lint test

      - name: Typecheck applications
        run: |
          pnpm exec nx run @org/backend:typecheck
          pnpm exec nx run frontend:typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run backend and frontend end-to-end tests
        shell: bash
        run: |
          # backend-e2e's own Nx-generated global-teardown unconditionally
          # kills whatever is listening on :3000 once its suite finishes
          # (apps/backend-e2e/src/support/global-teardown.ts), regardless of
          # who started it. So the backend has to be (re)started before each
          # suite that needs it, not just once up front. The prior backend
          # process is explicitly killed (not just left to killPort) before
          # restarting, since a still-running `nx serve` from the first
          # start can otherwise contend with the second and slow its build/
          # boot past a short retry budget.
          start_backend() {
            if [ -n "${backend_pid:-}" ]; then
              kill "$backend_pid" 2>/dev/null || true
              wait "$backend_pid" 2>/dev/null || true
            fi
            pnpm exec nx serve @org/backend > /tmp/bravely-backend.log 2>&1 &
            backend_pid=$!
            for attempt in {1..120}; do
              if curl --silent --fail http://localhost:3000/api > /dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          trap 'kill "$backend_pid" 2>/dev/null || true; cat /tmp/bravely-backend.log' EXIT

          start_backend
          curl --fail http://localhost:3000/api
          pnpm exec nx run @org/backend-e2e:e2e-ci

          start_backend
          curl --fail http://localhost:3000/api
          pnpm exec nx run frontend-e2e:e2e
