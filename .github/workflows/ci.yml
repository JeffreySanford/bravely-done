name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bravely:bravely_dev_only@localhost:5432/bravely_done?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bravely
          POSTGRES_PASSWORD: bravely_dev_only
          POSTGRES_DB: bravely_done
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bravely -d bravely_done"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @org/backend exec prisma generate --config prisma.config.ts

      - name: Apply database migrations
        run: pnpm --filter @org/backend exec prisma migrate deploy --config prisma.config.ts

      - name: Check formatting
        run: pnpm exec nx format:check --base=origin/master

      - name: Build, lint, and unit test
        run: pnpm exec nx run-many -t build lint test

      - name: Typecheck applications
        run: |
          pnpm exec nx run @org/backend:typecheck
          pnpm exec nx run frontend:typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run end-to-end tests
        run: pnpm exec nx run-many -t e2e --parallel=1
