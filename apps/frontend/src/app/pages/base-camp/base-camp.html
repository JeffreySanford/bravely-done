<div class="stage">
  @if (renderScene) {
    <canvas #sceneCanvas class="stage__canvas" aria-hidden="true"></canvas>
  } @else {
    <div class="grid-veil" aria-hidden="true"></div>
  }

  <header class="stage__header">
    <span class="stage__mark">BRAVELY DONE</span>
    <h1>Base Camp</h1>
    @if (characterName(); as name) {
      <p class="stage__subtitle">{{ name }} has arrived.</p>
    } @else {
      <p class="stage__subtitle">Welcome back.</p>
    }
  </header>

  <div class="stage__footer">
    <div class="bridge-status">
      <p class="bridge-status__label">Bridge repair: {{ constructionStage() }} / {{ maxConstructionStage }}</p>
      <button
        type="button"
        class="bd-button"
        [disabled]="advancingBridge() || constructionStage() >= maxConstructionStage"
        (click)="completeMockQuest()"
      >
        @if (constructionStage() >= maxConstructionStage) {
          Bridge repaired
        } @else {
          Complete a mock quest
        }
      </button>
    </div>

    <a routerLink="/characters" class="bd-button bd-button--ghost stage__back">Back to characters</a>
  </div>
</div>
