<div class="stage">
  @if (renderScene) {
    <canvas #sceneCanvas class="stage__canvas" aria-hidden="true"></canvas>
  } @else {
    <div class="grid-veil" aria-hidden="true"></div>
  }

  <header class="stage__header">
    <span class="stage__mark">BRAVELY DONE</span>
    <h1>Choose your character</h1>
    <p class="stage__subtitle">Return to the world you're building, or begin again.</p>
  </header>

  @if (loading()) {
    <p class="stage__status">Loading characters…</p>
  } @else {
    <div class="roster">
      @for (character of items(); track character.id) {
        <article class="card">
          <div class="card__glow"></div>
          <span class="card__glyph">◆</span>
          <h2>{{ character.name }}</h2>
        </article>
      }

      <a routerLink="/characters/new" class="card card--add">
        <span class="card__glyph">+</span>
        <h2>New character</h2>
      </a>
    </div>
  }

  <button type="button" class="bd-button bd-button--ghost stage__logout" (click)="logout()">Log out</button>
</div>
