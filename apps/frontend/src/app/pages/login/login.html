<app-auth-shell title="Welcome back" subtitle="Return to camp — log in to continue.">
  @if (errorMessage()) {
    <div class="bd-error-banner" role="alert">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="bd-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.bd-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      <span class="bd-field__hint">
        @if (form.controls.email.invalid && form.controls.email.touched) {
          Enter a valid email address.
        }
      </span>
    </div>

    <div class="bd-field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.bd-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <span class="bd-field__hint">
        @if (form.controls.password.invalid && form.controls.password.touched) {
          Password is required.
        }
      </span>
    </div>

    <button type="submit" class="bd-button" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="bd-footer-link">New here? <a routerLink="/signup">Create an account</a></p>
</app-auth-shell>
