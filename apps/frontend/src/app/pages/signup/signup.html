<app-auth-shell title="Create your account" subtitle="First brave step: sign up, then build your character.">
  @if (errorMessage()) {
    <div class="bd-error-banner" role="alert">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="bd-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.bd-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      <span class="bd-field__hint">
        @if (form.controls.email.invalid && form.controls.email.touched) {
          Enter a valid email address.
        }
      </span>
    </div>

    <div class="bd-field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [class.bd-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <span class="bd-field__hint">
        @if (form.controls.password.invalid && form.controls.password.touched) {
          At least 12 characters.
        }
      </span>
    </div>

    <button type="submit" class="bd-button" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="bd-footer-link">Already have an account? <a routerLink="/login">Log in</a></p>
</app-auth-shell>
