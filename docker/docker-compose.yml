name: bravely-done

services:
  postgres:
    image: postgres:16-alpine
    container_name: bravely-done-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bravely
      POSTGRES_PASSWORD: bravely_dev_only
      POSTGRES_DB: bravely_done
    ports:
      - '5432:5432'
    volumes:
      - bravely-done-postgres-data:/var/lib/postgresql/data

volumes:
  bravely-done-postgres-data:
