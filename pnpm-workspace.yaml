packages:
  - 'packages/*'
  - 'apps/backend'
  - 'apps/backend-e2e'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  argon2: true

# Dependabot-flagged transitive dependencies (all dev-tooling, not code we
# ship) pinned to their patched versions. Scoped to the vulnerable range only
# where multiple majors coexist in the tree, so unrelated consumers aren't
# forced onto an unrelated major bump.
overrides:
  'axios@<1.18.0': '>=1.18.1'
  'brace-expansion@>=3.0.0 <5.0.9': '>=5.0.9'
  'postcss@<8.5.23': '>=8.5.23'
  'webpack-dev-server@<5.2.6': '>=5.2.6'
  'js-yaml@>=5.0.0 <5.2.2': '>=5.2.2'
  uuid: '>=11.1.1'
  '@hono/node-server': '>=2.0.5'
  find-my-way: '>=9.7.0'
